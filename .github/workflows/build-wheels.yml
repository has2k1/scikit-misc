# Ref: https://github.com/scipy/scipy/blob/main/.github/workflows/windows.yml

# Workflow to build and test wheels.
# To work on the wheel building infrastructure on a fork, comment out:
#
# if: github.repository == 'has2k1/scikit-misc'
#
# in the get_commit_message job include [wheel build] in your commit
# message to trigger the build. All files related to wheel building are located
# at tools/wheels/
name: Build Wheels
on:
  schedule:
    #        ┌───────────── minute (0 - 59)
    #        │  ┌───────────── hour (0 - 23)
    #        │  │ ┌───────────── day of the month (1 - 31)
    #        │  │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    #        │  │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    #        │  │ │ │ │
    - cron: "0  0 * * 6"
  push:
    tags:
      - v*
    branches:
      - wheels
  workflow_dispatch:

permissions:
   contents: read  # to fetch code (actions/checkout)

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  parse_commit_info:
    name: Parse Commit Information
    runs-on: ubuntu-latest
    if: github.repository == 'has2k1/scikit-misc'
    outputs:
      can_build: ${{ steps.decide.outputs.can_build }}
      publish_index: ${{ steps.decide.outputs.publish_index }}
      publish_url: ${{ steps.decide.outputs.publish_url }}
    steps:
      - name: Checkout scikit-misc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch all Tags
        run: |
          git fetch --tags --force
          git log -n 1

      - name: Copy build utils
        run: |
          cp -r .github/utils ../utils

      - name: Environment information
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
          echo "GITHUB_REF_TYPE=$GITHUB_REF_TYPE"
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "git describe: $(git describe --long)"

      - name: Debug
        run: |
          set -xe
          commit_message=$(python ../utils/please.py commit_message)
          skip_ci_message=$(python ../utils/please.py skip_ci_message)
          skip_gha_message=$(python ../utils/please.py skip_gha_message)
          skip_build=$(python ../utils/please.py skip_build)
          is_wheel_build=$(python ../utils/please.py is_wheel_build)

      - name: Decide Whether to Build and/or Release
        id: decide
        run: |
          set -xe
          CAN_BUILD=$(python ../utils/please.py can_i_build)
          CAN_RELEASE=$(python ../utils/please.py can_i_release)
          CAN_PRE_RELEASE=$(python ../utils/please.py can_i_pre_release)

          echo "can_build=$CAN_BUILD" >> $GITHUB_OUTPUT

          # The tag patterns for a release and a pre-release are exclusive
          PUBLISH_INDEX=""
          PUBLISH_URL=""
          if [ "$CAN_RELEASE" = "true" ]; then
            PUBLISH_INDEX="PyPI"
            PUBLISH_URL="https://upload.pypi.org/legacy/"
          elif [ "$CAN_PRE_RELEASE" = "true" ]; then
            PUBLISH_INDEX="TestPyPI"
            PUBLISH_URL="https://test.pypi.org/legacy/"
          fi
          echo "publish_index=$PUBLISH_INDEX" >> $GITHUB_OUTPUT
          echo "publish_url=$PUBLISH_URL" >> $GITHUB_OUTPUT
          echo github.ref ${{ github.ref }}

  build_wheels:
    name: Wheel, ${{ matrix.python }}-${{ matrix.buildplat[1] }}
    needs: parse_commit_info
    if: contains(needs.parse_commit_info.outputs.can_build, 'true')
    runs-on: ${{ matrix.buildplat[0] }}

    strategy:
      # Ensure that a wheel builder finishes even if another fails
      fail-fast: false
      matrix:
        # Github Actions doesn't support pairing matrix values together, let's improvise
        # https://github.com/github/feedback/discussions/7835#discussioncomment-1769026
        buildplat:
        # should also be able to do multi-archs on a single entry, e.g.
        # [windows-2019, win*, "AMD64 x86"]. However, those two require a different compiler setup
        # so easier to separate out here.
        - [ubuntu-24.04, manylinux_x86_64]
        - [ubuntu-24.04-arm, manylinux_aarch64]
        # - [macos-13, macosx_x86_64]
        - [macos-14, macosx_arm64]
        - [windows-2025, win_amd64]

        python: ["cp310", "cp311", "cp312", "cp313", "cp314"]
        python-version: [3.13]

    steps:
      - name: Checkout scikit-misc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install a specific version of uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"

      - name: Fetch all Tags
        run: |
          git fetch --tags --force
          echo "git describe: $(git describe --long)"

      - name: Copy build utils
        run: |
          cp -r .github/utils ../utils

      - name: Checkout build target
        run: |
          python ../utils/please.py checkout_build_commit
          git describe --long

      - name: Install pip packages
        run: |
          uv pip install wheel

      - name: Windows - Install rtools
        if: runner.os == 'Windows'
        run: |
          # mingw-w64
          choco install rtools -y --no-progress --force --version=4.0.0.20220206
          echo "c:\rtools40\ucrt64\bin;" >> $env:GITHUB_PATH


      - name: macOS - Setup
        if: matrix.buildplat[0] == 'macos-13' || matrix.buildplat[0] == 'macos-14'
        run: |
          # Needed due to https://github.com/actions/runner-images/issues/3371
          # Supported versions: https://github.com/actions/runner-images/blob/main/images/macos/macos-14-arm64-Readme.md
          echo "FC=gfortran-13" >> "$GITHUB_ENV"
          echo "F77=gfortran-13" >> "$GITHUB_ENV"
          echo "F90=gfortran-13" >> "$GITHUB_ENV"
          CIBW="RUNNER_OS=macOS"
          echo "CIBW_ENVIRONMENT_MACOS=$CIBW" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@adba99c781d3746d38b3a09b1cf797965bcb7fe6 # v4.3.0
        env:
          CIBW_PRERELEASE_PYTHONS: True
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.buildplat[1] }}

      - name: Check Package Version
        run: |
          ls wheelhouse/*.whl
          python ../utils/check_package_version.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # upload-artifact v4 and later do not merge artifacts with the same
          # name (even if the contents are different). So in a matrix, we have
          # to give each artifact a unique name. We merge these later in
          # another job.
          name: skmisc-wheel-${{ matrix.python }}-${{ matrix.buildplat[1] }}
          path: ./wheelhouse/*.whl

  build_pyodide_wheels:
    name: Wheel, pyodide
    needs: parse_commit_info
    if: contains(needs.parse_commit_info.outputs.can_build, 'true')
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: [3.13]

    steps:
      - name: Checkout scikit-misc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install a specific version of uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"

      - name: Fetch all Tags
        run: |
          git fetch --tags --force
          echo "git describe: $(git describe --long)"

      - name: Copy build utils
        run: |
          cp -r .github/utils ../utils

      - name: Checkout build target
        run: |
          python ../utils/please.py checkout_build_commit
          git describe --long

      - name: Backport pyodide support to the build target
        # TEMPORARY: v0.5.2 predates the pyodide support. Copy the files
        # that add it from the commit that triggered this run (the tip of
        # the wheels branch) into the working tree, without committing, so
        # that the version reported by git is still that of the tag.
        # Remove this step together with the "[wheel build: v0.5.2]" commit.
        run: |
          git restore --source="$GITHUB_SHA" --worktree -- \
            pyproject.toml \
            tools/wheels/f2c_runtime.c \
            tools/wheels/pyodide_f2c_patch.py
          git status --short
          git describe --long

      - name: Build f2c
        # Pyodide translates Fortran to C with f2c. Build the fork that
        # Pyodide uses for SciPy.
        run: |
          git clone https://github.com/hoodmane/f2c.git --depth 1 ../f2c
          cd ../f2c/src
          cp makefile.u makefile
          sed -i "s/gram.c:/gram.c1:/" makefile
          make
          echo "$PWD" >> "$GITHUB_PATH"
          echo "CPATH=$PWD" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@adba99c781d3746d38b3a09b1cf797965bcb7fe6 # v4.3.0
        env:
          CIBW_PLATFORM: pyodide
          # Latest Pyodide
          CIBW_BUILD: cp314-pyodide_wasm32

      - name: Check Package Version
        run: |
          ls wheelhouse/*.whl
          python ../utils/check_package_version.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Matches skmisc-wheel-* so that the publish job uploads it.
          name: skmisc-wheel-pyodide
          path: ./wheelhouse/*.whl

  build_sdist:
    runs-on: ubuntu-latest
    name: Build Source Distribution
    needs: [build_wheels]
    strategy:
      matrix:
        python-version: [3.13]
    steps:
      - name: Checkout scikit-misc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install a specific version of uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"

      - name: Fetch all Tags
        run: |
          git fetch --tags --force

      - name: Copy build utils
        run: |
          cp -r .github/utils ../utils

      - name: Checkout build target
        run: |
          python ../utils/please.py checkout_build_commit

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gfortran

      - name: Install requirements
        run: |
          uv pip install ".[build]"

      - name: Create Source Distribution
        run: |
          make sdist

      - name: Check Package Version
        run: |
          ls dist/*.tar.gz
          python ../utils/check_package_version.py

      - name: Upload Source dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skmisc-sdist
          path: dist/*.tar.gz

  # Ref: https://github.com/pypa/gh-action-pypi-publish
  publish:
    runs-on: ubuntu-latest
    name: Upload Release to ${{ needs.parse_commit_info.outputs.publish_index }}
    needs: [parse_commit_info, build_wheels, build_pyodide_wheels, build_sdist]

    if: needs.parse_commit_info.outputs.publish_url != ''

    environment:
      name: release
      url: https://github.com/has2k1/scikit-misc

    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: skmisc-wheel-*
          path: dist/wheels
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skmisc-sdist
          path: dist/sdist

      # Publish wheels first so that there is no window where users
      # may accidentally install an sdist instead of a wheel
      - name: Publish wheels
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ needs.parse_commit_info.outputs.publish_url }}
          packages-dir: dist/wheels
          skip-existing: true

      - name: Publish sdist
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ needs.parse_commit_info.outputs.publish_url }}
          packages-dir: dist/sdist
          skip-existing: true
